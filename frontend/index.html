<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BlockVault — Blockchain-based document verification & management. Register document hashes on-chain and verify authenticity instantly."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BlockVault — Blockchain Document Verification</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('bv_theme');
          var dark =
            mode === 'dark'
              ? true
              : mode === 'light'
                ? false
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
