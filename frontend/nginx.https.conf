# BlockVault HTTPS nginx config.
#
# Use this instead of nginx.conf when you terminate TLS inside the frontend
# container rather than at a load balancer / ingress.
#
#   - Requests on port 80 are redirected to HTTPS (with HSTS).
#   - Certificates are auto-renewed by the certbot sidecar, which writes the
#     live certs into the shared volume mounted at /etc/letsencrypt.
#   - HTTP/2 is enabled on the TLS listener.
#   - The /api proxy keeps buffering OFF so the SSE notifications stream works.
#
# BEFORE USING: replace every `app.yourdomain.com` with your real domain.
# Pair with a certbot sidecar in docker-compose that:
#   - mounts a `certbot-webroot:/var/www/certbot` volume (also mounted into
#     this nginx at the same path so ACME challenges resolve),
#   - mounts a `certbot-certs:/etc/letsencrypt` volume (mounted here at
#     /etc/letsencrypt for the certificate files),
#   - runs `certbot certonly --webroot -w /var/www/certbot -d app.yourdomain.com`.

# Serve ACME challenges for certbot on a bare HTTP listener.
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Hardening headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API through the same origin (no CORS) with SSE intact.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
